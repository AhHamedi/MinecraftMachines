name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java simulation and bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and physics submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run deterministic tests and compile NeoForge integration
        run: ./gradlew :minecraft_machines:common:test :minecraft_machines:neoforge:compileJava --stacktrace

  python:
    name: Python protocol and evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/python/pyproject.toml

      - name: Install core test dependency
        run: python -m pip install "numpy>=1.26,<3"

      - name: Run protocol, environment, and evaluation tests
        env:
          PYTHONPATH: training/python/src
        run: python -m unittest discover -s training/python/tests

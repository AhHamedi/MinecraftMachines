plugins {
    id 'net.neoforged.moddev' version '2.0.144' apply false
}

def modPropertiesFile(String modName) {
    def includedProject = findProject(":${modName}")
    if (includedProject != null) {
        def externalProps = includedProject.file("gradle.properties")
        if (externalProps.exists()) {
            return externalProps
        }
    }

    return file("${rootProject.projectDir}/${modName}/gradle.properties")
}

def configureModSubprojects(String modName) {
    configure(subprojects.findAll { it.path.startsWith(":${modName}:") }) {
        def modProps = new Properties()
        def propsFile = modPropertiesFile(modName)
        propsFile.withInputStream { modProps.load(it) }

        modProps.each { key, value ->
            project.ext.set(key.toString(), value)
        }

        version = modProps.getProperty('mod_version') ?: rootProject.findProperty("${modName}_version") ?: rootProject.mod_version
        group = modProps.group
        description = modProps.description
    }
}

configureModSubprojects('simulated')
configureModSubprojects('aeronautics')
configureModSubprojects('minecraft_machines')

subprojects {
    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            url = "https://maven.ryanhcode.dev/releases"
        }

        maven {
            url = "https://maven.ryanhcode.dev/snapshots"
        }

        maven {
            url = "https://maven.ryanhcode.dev/private"

            authentication {
                basic(BasicAuthentication)
            }

            credentials {
                username = System.getenv('local_maven_user') ?: project.findProperty('ryanhcodeMavenUser') ?: ''
                password = System.getenv('local_maven_token') ?: project.findProperty('ryanhcodeMavenToken') ?: ''
            }
        }

        maven { url = "https://maven.createmod.net" }
        maven { url = "https://mvn.devos.one/snapshots" }
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
        maven { url = "https://maven.theillusivec4.top/" }

        maven {
            name = 'Jared maven'
            url = 'https://maven.blamejared.com/'
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }

        maven {
            url = "https://maven.squiddev.cc"
            content {
                includeGroup("cc.tweaked")
            }
        }
    }
}

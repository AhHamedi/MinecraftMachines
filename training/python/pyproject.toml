[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-machines-training"
version = "0.1.0"
description = "Python PPO tooling for Minecraft Machines training bridge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<3",
    "gymnasium>=0.29,<1.1",
    "stable-baselines3>=2.3,<3",
    "torch>=2.1,<3",
    "tensorboard>=2.15,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a running Minecraft Machines bridge",
]
